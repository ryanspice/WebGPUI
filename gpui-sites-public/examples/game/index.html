<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPUI game HUD demo</title>
  <meta name="robots" content="noindex,follow">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#0b1018;color:#e2e8f0;font:15px system-ui,sans-serif}
    #status{position:fixed;top:12px;left:12px;z-index:1000;pointer-events:none;max-width:calc(100% - 24px);padding:8px 12px;background:#161d2a;border:1px solid #374151;border-radius:8px}
    #status.error{border-color:#ff6b6b;color:#ffccd5;white-space:pre-wrap}
    canvas{display:block}
  </style>
</head>
<body>
  <div id="status" role="status">Initializing GPUI game HUD…</div>
  <script type="module" src="./demo.mjs"></script>
</body>
</html>
