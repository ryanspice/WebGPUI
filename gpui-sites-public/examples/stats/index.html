<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebGPUI · renderer stats</title>
  <meta name="robots" content="noindex,follow">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:#0b0f17;color:#e2e8f0;font:15px/1.55 system-ui,sans-serif}
    main{max-width:820px;margin:0 auto;padding:40px 24px 64px}
    h1{font-size:26px;margin:0 0 6px}
    .tag{color:#9ca3af;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    table{border-collapse:collapse;width:100%;margin-top:22px;background:#111827;border:1px solid #1f2937;border-radius:10px;overflow:hidden}
    th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #1f2937;font-size:14px}
    th{color:#9ca3af;font-weight:600;background:#0d1422}
    tr:last-child td{border-bottom:0}
    .good{color:#3ecfa2}
    .note{color:#9ca3af;font-size:13px;margin-top:16px}
    a{color:#89b4ff}
    #status{padding:12px 14px;border:1px solid #374151;border-radius:8px;background:#161d2a;margin-top:18px}
  </style>
</head>
<body>
<main>
  <div class="tag">WebGPUI build v0.3.1</div>
  <h1>GPUI vs HTML — measured in this browser</h1>
  <p class="note">The numbers below are collected live on this page, not benchmarks published by the SDK. See the note at the bottom for limits.</p>
  <div id="status">Measuring…</div>
  <table id="stats" hidden>
    <thead><tr><th>Metric</th><th>GPUI (WASM / WebGL2)</th><th>HTML / CSS / DOM</th></tr></thead>
    <tbody></tbody>
  </table>
  <p class="note"><a href="../compare/">← Renderer toggle</a> · <a href="../../">SDK home</a></p>
</main>
<script type="module">
  const status = document.querySelector('#status');
  const table = document.querySelector('#stats');
  const rows = [];
  const add = (metric, gpui, html) => rows.push([metric, gpui, html]);
  const ms = n => Number.isFinite(n) ? n.toFixed(1) + ' ms' : 'n/a';
  const bytes = n => Number.isFinite(n) && n > 0 ? (n / 1024).toFixed(1) + ' KB' : 'not exposed';

  try {
    const manifest = await (await fetch('../../v1/manifest.json?v=0.3.1')).json();
    add('SDK version', manifest.version, 'n/a (browser built-in)');
    add('Renderer', 'Rust/WASM → WebGL2 canvas', 'HTML elements + CSS');

    // HTML replica: construct, count nodes, time a state update.
    const replica = document.createElement('div');
    replica.innerHTML = '<div class="hud"><div>COUNT</div><strong data-count>0</strong><button data-plus>+</button></div>';
    const tHtml0 = performance.now();
    document.body.appendChild(replica);
    const htmlNodes = replica.querySelectorAll('*').length + 1;
    const countEl = replica.querySelector('[data-count]');
    let htmlClick = NaN;
    const htmlStart = performance.now();
    const observer = new MutationObserver(() => {
      if (countEl.textContent === '1' && !Number.isFinite(htmlClick))
        htmlClick = performance.now() - htmlStart;
    });
    observer.observe(countEl, { childList: true, characterData: true, subtree: true });
    const plus = replica.querySelector('[data-plus]');
    plus.addEventListener('click', () => {
      countEl.textContent = String(Number(countEl.textContent) + 1);
    });
    plus.click();
    await new Promise(resolve => requestAnimationFrame(resolve));
    observer.disconnect();
    replica.remove();
    add('DOM nodes for widget', '1 canvas', String(htmlNodes));

    // GPUI: module load, native init, first paint, interaction latency.
    const t0 = performance.now();
    const { mount, ui } = await import('../../v1/gpui.mjs?v=0.3.1');
    const tImport = performance.now() - t0;
    const t1 = performance.now();
    const root = await mount({
      title: 'WebGPUI stats', width: 480, height: 420,
      initialState: { count: 0 },
      view: (state, update) => ui.column({ style: { width: '100%', height: '100%', padding: 24, gap: 12, background: '#111827' } }, [
        ui.text('Count: ' + state.count),
        ui.button('+', () => update({ count: state.count + 1 }))
      ])
    });
    const tInit = performance.now() - t1;
    let painted = [];
    const paintStart = performance.now();
    while (performance.now() - paintStart < 10000) {
      painted = root.renderer.getPaintedText();
      if (painted.some(s => s.includes('Count: 0'))) break;
      await new Promise(r => setTimeout(r, 50));
    }
    const tPaint = performance.now() - paintStart;
    await new Promise(r => setTimeout(r, 1000));
    const tree = JSON.parse(root.renderer.getAutomationTree());
    const find = (node, label) => {
      if (node.text === label && node.bounds) return node;
      for (const child of node.children || []) { const hit = find(child, label); if (hit) return hit; }
      return null;
    };
    const plusNode = find(tree, '+');
    const clickStart = performance.now();
    root.renderer.simulateClick(plusNode.bounds.x + plusNode.bounds.width / 2, plusNode.bounds.y + plusNode.bounds.height / 2, 0);
    let changed = false;
    while (performance.now() - clickStart < 5000) {
      painted = root.renderer.getPaintedText();
      if (painted.some(s => s.includes('Count: 1'))) { changed = true; break; }
      await new Promise(r => setTimeout(r, 50));
    }
    const gpuClick = performance.now() - clickStart;

    add('ES module fetch + parse', ms(tImport), 'built in');
    add('Native init (WASM + window)', ms(tInit), '0 ms');
    add('First painted content', ms(tPaint), 'synchronous with DOM insert');
    add('Click → visible update', changed ? ms(gpuClick) : 'failed', ms(htmlClick));

    const resources = performance.getEntriesByType('resource');
    const mod = resources.find(r => r.name.includes('gpui.mjs'));
    const wasm = resources.find(r => r.name.includes('.wasm'));
    add('Module transfer size', bytes(mod?.transferSize), '0 KB (no runtime)');
    add('WASM transfer size', bytes(wasm?.transferSize), 'n/a');
    add('Observed painted text', '“' + painted.slice(0, 4).join('”, “') + '”', 'DOM text nodes');

    table.hidden = false;
    table.querySelector('tbody').innerHTML = rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('');
    status.textContent = changed ? 'Measurement complete · ' + manifest.version : 'Measurement complete but GPUI click did not update — see last row.';
  } catch (error) {
    status.textContent = 'Measurement failed: ' + (error?.message ?? String(error));
    console.error(error);
  }
</script>
</body>
</html>
